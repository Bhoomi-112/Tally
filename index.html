<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />

    <!-- SEO -->
    <title>Tally — Census 2027 Companion</title>
    <meta
      name="description"
      content="Tally is a free GenAI-powered companion for India's Census 2027. Check state-wise census dates, understand the enumeration process, and protect your privacy."
    />
    <meta name="theme-color" content="#FF6B00" />

    <!-- Open Graph -->
    <meta property="og:title" content="Tally — Census 2027 Companion" />
    <meta
      property="og:description"
      content="State-wise census dates, guided enumeration walkthrough, and AI-powered explainer for India's first digital census."
    />
    <meta property="og:type" content="website" />

    <!-- Security headers via meta (supplemented by hosting config) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com; img-src 'self' data:;"
    />

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
