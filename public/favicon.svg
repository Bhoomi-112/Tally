<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Deep Obsidian Backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Kesari / Saffron Flow -->
    <linearGradient id="kesari" x1="4" y1="4" x2="28" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>

    <!-- Deep Emerald Green Flow -->
    <linearGradient id="emerald" x1="4" y1="18" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Ashoka Navy & Cyan Core -->
    <linearGradient id="chakra" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="32" height="32" rx="9" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" stroke="#334155" stroke-opacity="0.6"/>

  <!-- Saffron Ascent Arc -->
  <path d="M6 11C6 7.5 9 5 16 5C23 5 26 7.5 26 11C26 13.5 22 14.5 16 14.5C10 14.5 6 13.5 6 11Z" fill="url(#kesari)"/>

  <!-- Green Foundation Arc -->
  <path d="M6 21C6 18.5 10 17.5 16 17.5C22 17.5 26 18.5 26 21C26 24.5 23 27 16 27C9 27 6 24.5 6 21Z" fill="url(#emerald)"/>

  <!-- Central Ashoka Wheel & Core Chakra -->
  <g filter="url(#bloom)">
    <!-- White Horizon Band Ring -->
    <circle cx="16" cy="16" r="4.8" fill="#FFFFFF" fill-opacity="0.12"/>
    <circle cx="16" cy="16" r="4.2" stroke="url(#chakra)" stroke-width="1.2"/>

    <!-- Geometric Ray Points -->
    <circle cx="16" cy="12.4" r="0.6" fill="#38BDF8"/>
    <circle cx="18.5" cy="13.4" r="0.6" fill="#38BDF8"/>
    <circle cx="19.6" cy="16" r="0.6" fill="#38BDF8"/>
    <circle cx="18.5" cy="18.6" r="0.6" fill="#38BDF8"/>
    <circle cx="16" cy="19.6" r="0.6" fill="#38BDF8"/>
    <circle cx="13.5" cy="18.6" r="0.6" fill="#38BDF8"/>
    <circle cx="12.4" cy="16" r="0.6" fill="#38BDF8"/>
    <circle cx="13.5" cy="13.4" r="0.6" fill="#38BDF8"/>

    <!-- Bindu Core -->
    <circle cx="16" cy="16" r="1.4" fill="#FFFFFF"/>
  </g>
</svg>
